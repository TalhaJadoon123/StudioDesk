rules:
  - id: no-hardcoded-secrets
    patterns:
      - pattern-either:
          - pattern: $X = "..."
            metavariable-regex:
              metavariable: $X
              regex: "(?i)(secret|password|token|key|api)"
          - pattern: $X = $Y
            metavariable-regex:
              metavariable: $X
              regex: "(?i)(secret|password|token|key|api)"
            metavariable-regex:
              metavariable: $Y
              regex: "['\"].+['\"]"
    message: "Potential hardcoded secret detected"
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: "CWE-798: Use of Hardcoded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: no-sql-injection
    patterns:
      - pattern-either:
          - pattern: query($SQL)
            metavariable-regex:
              metavariable: $SQL
              regex: ".*\\$.*"
          - pattern: execute($SQL)
            metavariable-regex:
              metavariable: $SQL
              regex: ".*\\+.*"
          - pattern: $DB.query($X + $Y)
          - pattern: $DB.execute($X + $Y)
    message: "Potential SQL injection via string concatenation"
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"

  - id: no-command-injection
    patterns:
      - pattern-either:
          - pattern: exec($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*\\$.*"
          - pattern: spawn($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*\\$.*"
          - pattern: execSync($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*\\$.*"
    message: "Potential command injection via user input"
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 - Injection"

  - id: no-path-traversal
    patterns:
      - pattern-either:
          - pattern: readFile($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*\\.\\..*"
          - pattern: writeFile($X, ...)
            metavariable-regex:
              metavariable: $X
              regex: ".*\\.\\..*"
          - pattern: resolve($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*\\.\\..*"
    message: "Potential path traversal via user input"
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-22: Path Traversal"
      owasp: "A01:2021 - Broken Access Control"

  - id: no-xss
    patterns:
      - pattern-either:
          - pattern: dangerouslySetInnerHTML={{__html: $X}}
            metavariable-regex:
              metavariable: $X
              regex: ".*"
          - pattern: innerHTML = $X
            metavariable-regex:
              metavariable: $X
              regex: ".*"
    message: "Potential XSS via dangerouslySetInnerHTML or innerHTML"
    languages: [typescript, javascript, tsx]
    severity: ERROR
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"

  - id: no-ssrf
    patterns:
      - pattern-either:
          - pattern: fetch($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*req.*|.*input.*|.*body.*"
          - pattern: axios.get($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*req.*|.*input.*|.*body.*"
          - pattern: axios.post($X, ...)
            metavariable-regex:
              metavariable: $X
              regex: ".*req.*|.*input.*|.*body.*"
    message: "Potential SSRF via user-controlled URL"
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-918: Server-Side Request Forgery"
      owasp: "A10:2021 - Server-Side Request Forgery"

  - id: insecure-crypto
    patterns:
      - pattern-either:
          - pattern: createHash('md5')
          - pattern: createHash('sha1')
          - pattern: crypto.randomBytes($X)
            metavariable-regex:
              metavariable: $X
              regex: "^[0-9]+$"
    message: "Use of weak cryptographic algorithms"
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: "A02:2021 - Cryptographic Failures"

  - id: no-eval
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: Function($X)
          - pattern: new Function($X)
    message: "Use of eval or Function constructor with dynamic code"
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"

  - id: unsafe-deserialization
    patterns:
      - pattern-either:
          - pattern: JSON.parse($X)
            metavariable-regex:
              metavariable: $X
              regex: ".*req.*|.*body.*"
    message: "Potential unsafe deserialization of user input"
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"

  - id: missing-auth-check
    patterns:
      - pattern-either:
          - pattern: $APP.get($URL, $HANDLER)
          - pattern: $APP.post($URL, $HANDLER)
          - pattern: $APP.put($URL, $HANDLER)
          - pattern: $APP.delete($URL, $HANDLER)
          - pattern: $APP.patch($URL, $HANDLER)
    message: "Route may be missing authentication check"
    languages: [typescript, javascript]
    severity: WARNING
    metadata:
      cwe: "CWE-306: Missing Authentication for Critical Function"
      owasp: "A07:2021 - Identification and Authentication Failures"

  - id: no-cors-wildcard
    patterns:
      - pattern-either:
          - pattern: origin: '*'
          - pattern: origin: true
    message: "CORS wildcard origin allows any origin - use explicit allowlist"
    languages: [typescript, javascript]
    severity: ERROR
    metadata:
      cwe: "CWE-942: Permissive Cross-domain Policy"
      owasp: "A05:2021 - Security Misconfiguration"